<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | Finance Tracker'">Finance Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<!-- Navbar fragment -->
<nav th:fragment="navbar" class="navbar">
    <div class="navbar-brand">
        <i class="bi bi-bar-chart-fill"></i> Finance Tracker
    </div>
    <ul class="navbar-nav">
        <li><a th:href="@{/dashboard}" th:classappend="${activePage == 'dashboard'} ? 'active'">
            <i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li><a th:href="@{/transactions}" th:classappend="${activePage == 'transactions'} ? 'active'">
            <i class="bi bi-arrow-left-right"></i> Transactions</a></li>
        <li><a th:href="@{/categories}" th:classappend="${activePage == 'categories'} ? 'active'">
            <i class="bi bi-tags"></i> Categories</a></li>
    </ul>
    <div class="navbar-user">
        <span sec:authentication="name"></span>
        <a th:href="@{/logout}" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</nav>

<!-- Flash messages fragment -->
<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
</div>

</body>
</html>
