<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-logo"><i class="bi bi-bar-chart-fill"></i></div>
    <h1 class="auth-title">Finance Tracker</h1>
    <p class="auth-sub">Sign in to your account</p>

    <div th:if="${param.error}" class="alert alert-error">Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form method="post" th:action="@{/login}" class="auth-form">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" placeholder="demo" required autofocus/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••" required/>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>

    <p class="auth-footer">No account? <a th:href="@{/register}">Register here</a></p>
    <p class="auth-hint">Demo: <strong>demo</strong> / <strong>password</strong></p>
</div>

</body>
</html>
