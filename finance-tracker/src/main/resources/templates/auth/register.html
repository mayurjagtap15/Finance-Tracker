<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-logo"><i class="bi bi-bar-chart-fill"></i></div>
    <h1 class="auth-title">Create Account</h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form method="post" th:action="@{/register}" th:object="${registrationDto}" class="auth-form">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Jane Doe" required/>
            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="field-error"></span>
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" th:field="*{username}" class="form-control" placeholder="janedoe" required/>
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="field-error"></span>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="jane@example.com" required/>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="Min. 6 characters" required/>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat password" required/>
            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="field-error"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Register</button>
    </form>

    <p class="auth-footer">Already have an account? <a th:href="@{/login}">Sign in</a></p>
</div>

</body>
</html>
