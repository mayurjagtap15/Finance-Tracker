<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transaction')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}" th:with="activePage='transactions'"></nav>

<main class="container">
    <div class="page-header">
        <h2 th:text="${transactionDto.id != null} ? 'Edit Transaction' : 'New Transaction'"></h2>
        <a th:href="@{/transactions}" class="btn btn-secondary">← Back</a>
    </div>

    <div class="section-card form-card">
        <form th:action="${transactionDto.id != null} ? @{/transactions/{id}/edit(id=${transactionDto.id})} : @{/transactions/new}"
              method="post"
              th:object="${transactionDto}">

            <div class="form-row">
                <div class="form-group">
                    <label>Type</label>
                    <select th:field="*{type}" class="form-control" required id="typeSelect">
                        <option value="">-- Select type --</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('type')}" th:errors="*{type}" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select th:field="*{categoryId}" class="form-control" required>
                        <option value="">-- Select category --</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name + ' (' + c.type + ')'}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="field-error"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" th:field="*{amount}" class="form-control"
                           step="0.01" min="0.01" placeholder="0.00" required/>
                    <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" th:field="*{transactionDate}" class="form-control" required/>
                    <span th:if="${#fields.hasErrors('transactionDate')}" th:errors="*{transactionDate}" class="field-error"></span>
                </div>
            </div>

            <div class="form-group">
                <label>Description (optional)</label>
                <input type="text" th:field="*{description}" class="form-control" placeholder="What was this for?"/>
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <span th:text="${transactionDto.id != null} ? 'Update Transaction' : 'Save Transaction'"></span>
                </button>
                <a th:href="@{/transactions}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
