<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="auth-page">

<div class="auth-card" style="text-align:center;max-width:480px">
    <div class="auth-logo" th:style="${statusCode == 404} ? 'color:#64748b' : 'color:#ef4444'">
        <i th:classappend="${statusCode == 404} ? 'bi-map' : 'bi-exclamation-triangle-fill'" class="bi"></i>
    </div>
    <h1 class="auth-title" th:text="${statusCode} + ' ' + ${statusName}">404 Not Found</h1>
    <p class="auth-sub" th:text="${message}">The page you are looking for does not exist.</p>
    <div style="margin-top:1.5rem;display:flex;gap:.75rem;justify-content:center">
        <a th:href="@{/dashboard}" class="btn btn-primary">Go to Dashboard</a>
        <a onclick="history.back()" href="#" class="btn btn-secondary">Go Back</a>
    </div>
</div>

</body>
</html>
