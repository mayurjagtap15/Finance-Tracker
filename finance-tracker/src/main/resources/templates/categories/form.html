<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New Category')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}" th:with="activePage='categories'"></nav>

<main class="container">
    <div class="page-header">
        <h2>New Category</h2>
        <a th:href="@{/categories}" class="btn btn-secondary">← Back</a>
    </div>

    <div class="section-card form-card">
        <form th:action="@{/categories/new}" method="post" th:object="${categoryDto}">

            <div class="form-group">
                <label>Name</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Groceries" required/>
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>
            </div>

            <div class="form-group">
                <label>Type</label>
                <select th:field="*{type}" class="form-control" required>
                    <option value="">-- Select type --</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                </select>
                <span th:if="${#fields.hasErrors('type')}" th:errors="*{type}" class="field-error"></span>
            </div>

            <div class="form-group">
                <label>Bootstrap Icon class (optional)</label>
                <input type="text" th:field="*{icon}" class="form-control" placeholder="bi-tag"/>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Category</button>
                <a th:href="@{/categories}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
